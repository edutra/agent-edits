# Private tmux server that keeps the agent-edits viewers alive between popups.
# It is invisible: no status bar, and the session ends when Neovim exits.
set -g status off
set -g escape-time 10
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm*:Tc,tmux*:Tc"
set -g focus-events on
set -g exit-empty on
